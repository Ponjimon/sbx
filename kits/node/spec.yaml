# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Node.js
author: Ponjimon
description: Node.js installed with n; version selected with the node_version arg
sourceUrl: https://github.com/tj/n
licenses: [MIT]
version: "1.0.0"

kind: mixin

provides: [nodejs]

args:
  node_version:
    default: "24"
    pattern: '^[0-9]+(\.[0-9]+){0,2}$'
    description: Node.js major ("24") or exact version ("24.22.2")


capabilities:
  - type: com.docker.sandbox/network-policy@1
    description: Download the n script from GitHub and Node.js from nodejs.org
    config:
      install:
        allow:
          - raw.githubusercontent.com
          - nodejs.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Install Node.js ${{ kit.args.node_version }} with n
          user: "0"
          command: |
            set -eu

            export N_PREFIX=/usr/local
            export PATH="/usr/local/bin:$PATH"

            # bootstrap n without npm (the base image has no Node/npm)
            curl -fsSL -o /usr/local/bin/n https://raw.githubusercontent.com/tj/n/v10.2.0/bin/n
            chmod 0755 /usr/local/bin/n

            n install ${{ kit.args.node_version }}

            hash -r

            node --version
            npm --version

            case "$(node -p 'process.versions.node')" in
              ${{ kit.args.node_version }}|${{ kit.args.node_version }}.*) ;;
              *) echo "expected Node ${{ kit.args.node_version }}" >&2; exit 1 ;;
            esac

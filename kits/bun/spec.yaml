# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: Bun
description: Bun from the official installer; version selected with the bun_version arg
sourceUrl: https://github.com/oven-sh/bun
licenses: [MIT]

kind: mixin

args:
  bun_version:
    default: latest
    pattern: '^(latest|[0-9]+\.[0-9]+\.[0-9]+)$'
    description: "'latest' or an exact version such as 1.3.13"

provides: [bun]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    description: Download Bun from the installer and its GitHub release
    config:
      install:
        allow:
          - bun.com
          - github.com
          - objects.githubusercontent.com   # release-asset redirect; not in v2, verify

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Install Bun ${{ kit.args.bun_version }}
          user: "0"
          command: |
            set -eu

            export BUN_INSTALL=/usr/local/lib/bun

            if [ "${{ kit.args.bun_version }}" = latest ]; then
              curl -fsSL https://bun.com/install | bash
            else
              curl -fsSL https://bun.com/install | bash -s "bun-v${{ kit.args.bun_version }}"
            fi

            ln -sf "$BUN_INSTALL/bin/bun" /usr/local/bin/bun
            ln -sf "$BUN_INSTALL/bin/bunx" /usr/local/bin/bunx

            bun --version
            bunx --version

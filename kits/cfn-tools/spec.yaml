# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: CloudFormation tools (cfn-lint + cfn-nag)
author: Ponjimon
description: cfn-lint and cfn-nag for the CloudFormation gates.
version: "1.0.0"

kind: mixin

provides:
  - "cfn-lint@${{ kit.args.cfnLintVersion }}"
  - "cfn-nag@${{ kit.args.cfnNagVersion }}"

args:
  cfnLintVersion:
    default: "1.60.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: cfn-lint release to install
    buildArg: CFN_LINT_VERSION
  cfnNagVersion:
    default: "0.8.10"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: cfn-nag gem version to install
    buildArg: CFN_NAG_VERSION


capabilities:
  - type: com.docker.sandbox/network-policy@1
    description: Install build deps from the distro mirrors, cfn-lint from PyPI and cfn-nag from RubyGems
    config:
      install:
        allow:
          - rubygems.org
          - "*.rubygems.org"
          - pypi.org
          - files.pythonhosted.org
          - deb.debian.org
          - security.debian.org
          - archive.ubuntu.com
          - security.ubuntu.com
          - ports.ubuntu.com

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Install cfn-lint ${{ kit.args.cfnLintVersion }} and cfn-nag ${{ kit.args.cfnNagVersion }}
          user: "0"
          command: |
            set -eu

            export DEBIAN_FRONTEND=noninteractive

            # python3 + venv for cfn-lint; ruby + headers + compiler for cfn-nag's native gems (psych)
            apt-get update
            apt-get install -y --no-install-recommends \
              python3 python3-venv \
              ruby ruby-dev libyaml-dev build-essential
            rm -rf /var/lib/apt/lists/*

            # cfn-lint in its own venv (avoids PEP 668 "externally managed" errors)
            python3 -m venv /opt/cfn-lint
            /opt/cfn-lint/bin/pip install --no-cache-dir "cfn-lint==${{ kit.args.cfnLintVersion }}"
            ln -sf /opt/cfn-lint/bin/cfn-lint /usr/local/bin/cfn-lint

            # cfn-nag, binaries into /usr/local/bin so they are on every user's PATH
            gem install cfn-nag -v "${{ kit.args.cfnNagVersion }}" --no-document --bindir /usr/local/bin

            cfn-lint --version
            cfn_nag_scan --version

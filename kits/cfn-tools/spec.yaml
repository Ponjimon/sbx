# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: CloudFormation tools (cfn-lint + cfn-nag)
description: cfn-lint and cfn-nag for the CloudFormation gates.
kind: mixin
version: "1.0.0"

args:
  cfnLintVersion:
    default: "1.60.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: cfn-lint release to install
    buildArg: CFN_LINT_VERSION
  cfnNagVersion:
    default: "0.8.10"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: cfn-nag gem version to install
    buildArg: CFN_NAG_VERSION

provides:
  - "cfn-lint@${{ kit.args.cfnLintVersion }}"
  - "cfn-nag@${{ kit.args.cfnNagVersion }}"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - rubygems.org
          - "*.rubygems.org"
          - pypi.org
          - files.pythonhosted.org
